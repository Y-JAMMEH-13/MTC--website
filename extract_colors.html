<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Extract Colors</title>
</head>

<body>
    <img id="logo" src="temp_logo.png" style="display:none;" crossorigin="anonymous">
    <h1>Extracted Colors</h1>
    <div id="colors">Processing...</div>
    <script>
        window.onload = function () {
            const img = document.getElementById('logo');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const colorCounts = {};

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const a = data[i + 3];

                if (a < 128) continue; // Skip transparent

                // Quantize to reduce noise
                const qr = Math.round(r / 20) * 20;
                const qg = Math.round(g / 20) * 20;
                const qb = Math.round(b / 20) * 20;

                const key = `${qr},${qg},${qb}`;
                colorCounts[key] = (colorCounts[key] || 0) + 1;
            }

            const sortedColors = Object.entries(colorCounts).sort((a, b) => b[1] - a[1]);
            const topColors = sortedColors.slice(0, 5).map(entry => {
                const [r, g, b] = entry[0].split(',').map(Number);
                return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
            });

            document.getElementById('colors').innerText = JSON.stringify(topColors);
        };
    </script>
</body>

</html>
